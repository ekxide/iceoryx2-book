  <rect class="gv-legend" x="315" y="50" width="150" height="20" rx="4"/>
  <text class="gv-legend-t gv-implementation" x="390" y="63" text-anchor="middle">in implementation</text>
  <rect class="gv-legend" x="505" y="50" width="150" height="20" rx="4"/>
  <text class="gv-legend-t gv-available" x="580" y="63" text-anchor="middle">available</text>

  <!-- Application layer -->
  <rect class="gv-app" x="30" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="50" y="98" text-anchor="middle">iceoryx2</text>
  <text class="gv-app-s" x="50" y="108" text-anchor="middle">App</text>
  <rect class="gv-app" x="80" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="100" y="98" text-anchor="middle">iceoryx2</text>
  <text class="gv-app-s" x="100" y="108" text-anchor="middle">App</text>

  <rect class="gv-app" x="195" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="215" y="98" text-anchor="middle">iceoryx2</text>
  <text class="gv-app-s" x="215" y="108" text-anchor="middle">App</text>

  <rect class="gv-app" x="287" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="307" y="98" text-anchor="middle">ROS 2</text>
  <text class="gv-app-s" x="307" y="108" text-anchor="middle">App</text>
  <rect class="gv-app" x="343" y="85" width="35" height="30" rx="5"/>
  <text class="gv-app-t" x="360" y="98" text-anchor="middle">DDS</text>
  <text class="gv-app-s" x="360" y="108" text-anchor="middle">App</text>

  <rect class="gv-app" x="565" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="585" y="98" text-anchor="middle">ROS 2</text>
  <text class="gv-app-s" x="585" y="108" text-anchor="middle">App</text>
  <rect class="gv-app" x="620" y="85" width="40" height="30" rx="5"/>
  <text class="gv-app-t" x="640" y="98" text-anchor="middle">ROS 2</text>
  <text class="gv-app-s" x="640" y="108" text-anchor="middle">Tool</text>

  <!-- Middleware layer -->
  <rect class="gv-mw" x="165" y="135" width="100" height="35" rx="6"/>
  <text class="gv-mw-t gv-available" x="215" y="147" text-anchor="middle">Tunnel</text>
  <rect class="gv-chip" x="170" y="152" width="28" height="13" rx="2"/>
  <text class="gv-chip-t gv-implementation" x="184" y="161" text-anchor="middle">Zenoh</text>
  <rect class="gv-chip" x="203" y="152" width="28" height="13" rx="2"/>
  <text class="gv-chip-t gv-funding" x="217" y="161" text-anchor="middle">smoltcp</text>
  <rect class="gv-chip" x="236" y="152" width="24" height="13" rx="2"/>
  <text class="gv-chip-t" x="248" y="161" text-anchor="middle">…</text>

  <rect class="gv-mw" x="285" y="135" width="100" height="35" rx="6"/>
  <text class="gv-mw-t gv-available" x="335" y="147" text-anchor="middle">Gateway</text>
  <rect class="gv-chip" x="290" y="152" width="24" height="13" rx="2"/>
  <text class="gv-chip-t gv-implementation" x="302" y="161" text-anchor="middle">ROS 2</text>
  <rect class="gv-chip" x="318" y="152" width="20" height="13" rx="2"/>
  <text class="gv-chip-t gv-funding" x="328" y="161" text-anchor="middle">DDS</text>
  <rect class="gv-chip" x="342" y="152" width="24" height="13" rx="2"/>
  <text class="gv-chip-t gv-funding" x="354" y="161" text-anchor="middle">MQTT</text>
  <rect class="gv-chip" x="370" y="152" width="10" height="13" rx="2"/>
  <text class="gv-chip-t" x="375" y="161" text-anchor="middle">…</text>

  <rect class="gv-mw" x="405" y="135" width="120" height="35" rx="6"/>
  <text class="gv-mw-t gv-available" x="465" y="147" text-anchor="middle">IDL &amp; Data Model</text>
  <rect class="gv-chip" x="410" y="152" width="34" height="13" rx="2"/>
  <text class="gv-chip-t gv-available" x="427" y="161" text-anchor="middle">FlatBuffers</text>
  <rect class="gv-chip" x="449" y="152" width="42" height="13" rx="2"/>
  <text class="gv-chip-t gv-funding" x="470" y="161" text-anchor="middle">Protobuf</text>
  <rect class="gv-chip" x="496" y="152" width="24" height="13" rx="2"/>
  <text class="gv-chip-t gv-funding" x="508" y="161" text-anchor="middle">…</text>

  <rect class="gv-mw" x="545" y="135" width="120" height="35" rx="6"/>
  <text class="gv-mw-t gv-implementation" x="605" y="156" text-anchor="middle">rmw_iceoryx2</text>

  <!-- iceoryx2 core -->
  <rect class="gv-core" x="20" y="190" width="740" height="90" rx="8"/>
  <rect class="gv-bind" x="30" y="206" width="720" height="20" rx="4"/>
  <text class="gv-bind-a" x="70"  y="219" text-anchor="middle">Rust</text>
  <text class="gv-bind-a" x="140" y="219" text-anchor="middle">C</text>
  <text class="gv-bind-a" x="210" y="219" text-anchor="middle">C++</text>
  <text class="gv-bind-a" x="280" y="219" text-anchor="middle">C#</text>
  <text class="gv-bind-a" x="350" y="219" text-anchor="middle">Python</text>
  <text class="gv-bind-p" x="420" y="219" text-anchor="middle">Go</text>
  <text class="gv-bind-p" x="490" y="219" text-anchor="middle">Lua</text>
  <text class="gv-bind-p" x="560" y="219" text-anchor="middle">Java</text>
  <text class="gv-bind-p" x="630" y="219" text-anchor="middle">Zig</text>
  <text class="gv-bind-p" x="700" y="219" text-anchor="middle">…</text>
  <!-- iceoryx2 brand: oryx mark + wordmark (matches the sidebar brand) -->
  <g transform="translate(299.97 223) scale(0.3756)" style="color: var(--ix-text, #eaf3f7)">
    <g class="gv-oryx" stroke="currentColor" stroke-linejoin="round">
      <path fill="#588bb5" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 848.671875 1037.96875 L 769.335938 1174.023438 L 749.492188 974.179688 Z M 848.671875 1037.96875 "/>
      <path fill="#588bb5" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 756.5625 1189.609375 L 718.515625 1258.398438 L 681.679688 1218.710938 Z M 756.5625 1189.609375 "/>
      <path fill="#b3e6ef" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 1444.53125 1230.859375 L 1303.828125 1216.25 L 1105.859375 1070.9375 Z M 1444.53125 1230.859375 "/>
      <path fill="#b3e6ef" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 730.078125 998.125 L 737.1875 1067.539062 L 521.015625 862.539062 Z M 730.078125 998.125 "/>
      <path fill="#588bb5" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 1445.703125 1211.640625 L 1384.570312 1180.15625 L 1362.65625 1044.101562 Z M 1445.703125 1211.640625 "/>
      <path fill="#b3e6ef" d="M 86.429688 94.785156 C 86.75 94.785156 101.570312 67.914062 101.570312 67.914062 L 73.390625 73.148438 L 86.429688 94.785156 "/>
      <path fill="#b3e6ef" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 1267.734375 1252.304688 L 1315.898438 1531.015625 L 1035 1325.9375 Z M 1267.734375 1252.304688 "/>
      <path fill="#588bb5" d="M 92.820312 87.738281 L 106.863281 92.855469 L 128.308594 77.566406 L 102.914062 69.160156 L 92.820312 87.738281 "/>
      <path fill="#588bb5" d="M 131.261719 57.824219 L 150.371094 56.046875 L 150.371094 53.316406 L 132.828125 46.078125 L 131.261719 57.824219 "/>
      <path fill="#b3e6ef" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 1314.53125 1406.40625 L 1365.234375 1410.273438 L 1285.273438 1244.53125 Z M 1314.53125 1406.40625 "/>
      <path fill="#588bb5" transform="matrix(0.1,0,0,-0.1,0,200)" d="M 1297.96875 1539.023438 L 851.40625 1539.0625 L 1243.398438 1500.039062 Z M 1297.96875 1539.023438 "/>
    </g>
  </g>
  <text class="gv-core-t" x="370" y="261" text-anchor="start" letter-spacing="-0.4">iceoryx<tspan fill="var(--ix-ice, #2dd4e8)">2</tspan></text>

  <!-- Platform layer (shifted down to clear the taller core band) -->
  <g transform="translate(0 28)">
  <rect class="gv-plat" x="20" y="262" width="70" height="88" rx="6"/>
  <text class="gv-plat-t gv-funding" x="55" y="304" text-anchor="middle">Bare</text>
  <text class="gv-plat-t gv-funding" x="55" y="316" text-anchor="middle">Metal</text>

  <rect class="gv-plat" x="100" y="262" width="70" height="88" rx="6"/>
  <text class="gv-plat-t gv-funding" x="135" y="298" text-anchor="middle">A-Core /</text>
  <text class="gv-plat-t gv-funding" x="135" y="310" text-anchor="middle">R-Core</text>

  <rect class="gv-plat" x="180" y="262" width="70" height="88" rx="6"/>
  <text class="gv-plat-t gv-funding" x="215" y="298" text-anchor="middle">Hypervisor</text>
  <text class="gv-plat-t gv-funding" x="215" y="310" text-anchor="middle">Partitions</text>

  <rect class="gv-region" x="260" y="262" width="320" height="45" rx="6"/>
  <text class="gv-region-t" x="420" y="277" text-anchor="middle">Operating Systems</text>
  <rect class="gv-pchip" x="266" y="284" width="38" height="16" rx="3"/>
  <text class="gv-pchip-t gv-funding" x="285" y="295" text-anchor="middle">Android</text>
  <rect class="gv-pchip" x="308" y="284" width="34" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="325" y="295" text-anchor="middle">Linux</text>
  <rect class="gv-pchip" x="346" y="284" width="38" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="365" y="295" text-anchor="middle">macOS</text>
  <rect class="gv-pchip" x="388" y="284" width="42" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="409" y="295" text-anchor="middle">FreeBSD</text>
  <rect class="gv-pchip" x="434" y="284" width="32" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="450" y="295" text-anchor="middle">QNX</text>
  <rect class="gv-pchip" x="470" y="284" width="42" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="491" y="295" text-anchor="middle">VxWorks</text>
  <rect class="gv-pchip" x="516" y="284" width="42" height="16" rx="3"/>
  <text class="gv-pchip-t gv-available" x="537" y="295" text-anchor="middle">Windows</text>
  <rect class="gv-pchip" x="562" y="284" width="12" height="16" rx="3"/>
  <text class="gv-pchip-t gv-funding" x="568" y="295" text-anchor="middle">…</text>

  <rect class="gv-plat" x="590" y="262" width="70" height="88" rx="6"/>
  <text class="gv-plat-t gv-funding" x="625" y="310" text-anchor="middle">GPU</text>
  <rect class="gv-plat" x="670" y="262" width="70" height="88" rx="6"/>
  <text class="gv-plat-t gv-funding" x="705" y="310" text-anchor="middle">FPGA</text>

  <rect class="gv-region" x="260" y="315" width="320" height="35" rx="6"/>
  <text class="gv-region-t" x="420" y="328" text-anchor="middle">Hardware Architectures</text>
