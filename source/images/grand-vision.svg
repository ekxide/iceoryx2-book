  <text class="gv-pchip-t" x="291" y="342" text-anchor="middle">x86_64</text>
  <rect class="gv-pchip" x="318" y="333" width="43" height="13" rx="3"/>
  <text class="gv-pchip-t" x="339" y="342" text-anchor="middle">x86_32</text>
  <rect class="gv-pchip" x="366" y="333" width="43" height="13" rx="3"/>
  <text class="gv-pchip-t" x="387" y="342" text-anchor="middle">AArch64</text>
  <rect class="gv-pchip" x="414" y="333" width="43" height="13" rx="3"/>
  <text class="gv-pchip-t" x="435" y="342" text-anchor="middle">ARMv7</text>
  <rect class="gv-pchip" x="462" y="333" width="43" height="13" rx="3"/>
  <text class="gv-pchip-t gv-funding" x="483" y="342" text-anchor="middle">RISC-V</text>
