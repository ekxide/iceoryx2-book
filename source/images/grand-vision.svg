  <text class="gv-pchip-t gv-funding" x="540" y="342" text-anchor="middle">…</text>

  </g>

  <!-- Connections -->
  <!-- direct iceoryx2 apps to core -->
  <line class="gv-flow" x1="50"  y1="117" x2="50"  y2="187" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="100" y1="117" x2="100" y2="187" marker-end="url(#gv-arrow)"/>
  <!-- tunnel app -> tunnel -> core -->
  <line class="gv-flow" x1="215" y1="117" x2="215" y2="132" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="215" y1="172" x2="215" y2="187" marker-end="url(#gv-arrow)"/>
  <!-- gateway apps -> gateway -> core -->
  <line class="gv-flow" x1="307" y1="117" x2="307" y2="132" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="360" y1="117" x2="360" y2="132" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="335" y1="172" x2="335" y2="187" marker-end="url(#gv-arrow)"/>
  <!-- serialization -> core -->
  <line class="gv-flow" x1="465" y1="172" x2="465" y2="187" marker-end="url(#gv-arrow)"/>
  <!-- ROS apps -> rmw -> core -->
  <line class="gv-flow" x1="585" y1="117" x2="585" y2="132" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="640" y1="117" x2="640" y2="132" marker-end="url(#gv-arrow)"/>
  <line class="gv-flow" x1="605" y1="172" x2="605" y2="187" marker-end="url(#gv-arrow)"/>
</svg>
