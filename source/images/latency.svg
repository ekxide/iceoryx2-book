<svg viewBox="0 0 1400 600" role="img" aria-label="Latency benchmark comparing iceoryx2, iceoryx classic, POSIX message queues, and unix domain sockets across payload sizes" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lt-title { font-family: var(--font-stack, sans-serif); font-size: 32px; font-weight: 700; fill: var(--ix-text, #eaf3f7); }
    .lt-sub { font-family: var(--font-stack, sans-serif); font-size: 18px; fill: var(--ix-muted, #bccbd6); }
    .lt-axis { stroke: var(--ix-muted-2, #6b7d8c); stroke-width: 2; fill: none; }
    .lt-grid { stroke: var(--ix-line, rgba(150,200,230,0.16)); stroke-width: 1; stroke-dasharray: 3 5; }
    .lt-tick { font-family: var(--font-stack, sans-serif); font-size: 17px; fill: var(--ix-muted-2, #6b7d8c); }
    .lt-label { font-family: var(--font-stack, sans-serif); font-size: 20px; font-weight: 600; fill: var(--ix-muted, #bccbd6); }
    .lt-key { font-family: var(--font-stack, sans-serif); font-size: 15px; font-weight: 600; fill: var(--ix-text, #eaf3f7); }
    .lt-series { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .lt-iox2 { stroke: var(--ix-ice, #2dd4e8); }
    .lt-iox { stroke: var(--ix-blue, #5b8def); }
    .lt-mq { stroke: #f5a623; }
    .lt-uds { stroke: #ff6b5b; }
    .lt-iox2-fill { fill: var(--ix-ice, #2dd4e8); }
    .lt-iox-fill { fill: var(--ix-blue, #5b8def); }
    .lt-mq-fill { fill: #f5a623; }
    .lt-uds-fill { fill: #ff6b5b; }
  </style>

  <text class="lt-title" x="733.5" y="43" text-anchor="middle">Benchmark</text>
  <text class="lt-sub" x="733.5" y="74" text-anchor="middle">Arch Linux on Intel i7 13700H</text>

  <g transform="translate(200 94)">
