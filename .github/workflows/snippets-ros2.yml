name: Snippets (ROS 2)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'snippets/gateway-to-ros-2/**'
      - '.github/workflows/snippets-ros2.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'snippets/gateway-to-ros-2/**'
      - '.github/workflows/snippets-ros2.yml'
  workflow_dispatch:

concurrency:
  group: snippets-ros2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snippets-ros2:
    name: snippets-ros2
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The colcon packages link against the ROS 2 rcl and typesupport
    # libraries, so they are built inside a ROS 2 container.
    container:
      image: ros:jazzy
    steps:
      # git is required by actions/checkout and is not present in the base
      # ros image, so it must be installed before checking out.
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4

      # The workspace mount is owned by the host runner user, not the
      # container user, so git refuses to operate on it without this.
      - name: Whitelist workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: apt-get install -y build-essential ca-certificates curl pkg-config python3-pip ros-dev-tools

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install cargo-aware colcon plugins
        run: pip3 install --break-system-packages colcon-cargo colcon-ros-cargo vcstool

      - name: Install cargo-ament-build
        run: cargo install cargo-ament-build --locked

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            snippets/gateway-to-ros-2/ws/build
            snippets/gateway-to-ros-2/ws/install
          key: snippets-ros2-jazzy-${{ hashFiles('snippets/gateway-to-ros-2/ws/*.repos', 'snippets/gateway-to-ros-2/ws/src/*/Cargo.toml') }}

      - name: Check Rust formatting (rustfmt)
        run: just format-ros2-snippets-check

      - name: Compile ROS 2 snippets
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          just build-ros2-snippets
